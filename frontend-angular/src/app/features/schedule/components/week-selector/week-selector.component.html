<div class="week-selector">
  <!-- כפתור שבוע קודם: משדר אירוע לאבא בלבד. -->
  <button
    class="week-selector__icon-button"
    type="button"
    aria-label="Previous week"
    [disabled]="isLoading"
    (click)="previousWeek.emit()"
  >
    &lt;
  </button>

  <!-- הטווח שמוצג מגיע מהאבא דרך weekRangeLabel. -->
  <div class="week-selector__range">
    <span class="week-selector__label">Selected week</span>
    <strong>{{ weekRangeLabel }}</strong>
  </div>

  <!-- כפתור שבוע הבא: משדר אירוע לאבא בלבד. -->
  <button
    class="week-selector__icon-button"
    type="button"
    aria-label="Next week"
    [disabled]="isLoading"
    (click)="nextWeek.emit()"
  >
    &gt;
  </button>

  @if (canGenerate) {
    <!-- הכפתור לא יוצר סידור בעצמו; הוא עושה emit לאבא. -->
    <button
      class="week-selector__generate-button"
      type="button"
      [disabled]="isLoading"
      (click)="generateSchedule.emit()"
    >
      {{ isLoading ? 'Generating...' : 'Generate Schedule' }}
    </button>
  }
</div>
